[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlgroup8"
version = "0.1.0"
description = "Group 8 coursework: a small GPT-style language model from scratch"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.26", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
